name: Docker integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-integration:
    name: Docker integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Docker-tagged tests
        run: mvn -B test -Dgroups=docker -Dsurefire.excludedGroups=
